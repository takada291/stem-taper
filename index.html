<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幹細り表</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #2e7d32; --bg: #f1f8e9; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h1 { font-size: 1.2rem; color: var(--primary); margin: 0 0 15px 0; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { font-size: 0.8rem; display: block; margin-bottom: 4px; color: #666; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        canvas { width: 100%; height: 300px; background: #fff; border-radius: 8px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; font-size: 0.9rem; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: center; }
        th { background: var(--primary); color: white; }
        tr:nth-child(even) { background: #fafafa; }
        .footer { text-align: center; font-size: 0.7rem; color: #999; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>幹細り表 v0.1</h1>
    
    <label>樹種選択（岐阜県標準）</label>
    <select id="species" style="margin-bottom: 15px;">
        <option value="sugi">スギ (a:1.018, b:-1.036, c:1.018)</option>
        <option value="hinoki">ヒノキ (a:1.231, b:-1.464, c:1.233)</option>
        <option value="broad">落葉広葉樹 (a:1.638, b:-2.124, c:1.486)</option>
    </select>

    <div class="grid">
        <div>
            <label>総樹高 H (m)</label>
            <input type="number" id="height" step="0.1" value="20.0">
        </div>
        <div>
            <label>胸高直径 D (cm)</label>
            <input type="number" id="dbh" step="0.1" value="30.0">
        </div>
    </div>
</div>

<div class="card">
    <canvas id="treeCanvas"></canvas>
    <table id="taperTable">
        <thead>
            <tr><th>高さ (m)</th><th>直径 (cm)</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="footer">© 2026 Takada Forestry DX / Data: 岐阜県標準パラメータ</div>

<script>
    const params = {
        sugi: { a: 1.018, b: -1.036, c: 1.018 },
        hinoki: { a: 1.231, b: -1.464, c: 1.233 },
        broad: { a: 1.638, b: -2.124, c: 1.486 }
    };

    const speciesEl = document.getElementById('species');
    const heightEl = document.getElementById('height');
    const dbhEl = document.getElementById('dbh');
    const tableBody = document.getElementById('tableBody');
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    function calculate() {
        const H = parseFloat(heightEl.value);
        const D = parseFloat(dbhEl.value);
        const p = params[speciesEl.value];
        
        // LocalStorage保存
        localStorage.setItem('taper_last_data', JSON.stringify({s: speciesEl.value, h: H, d: D}));

        // テーブル更新
        tableBody.innerHTML = '';
        const intervals = [0.2, 1.2];
        for(let i=2; i<=H; i+=2) intervals.push(i);
        if(!intervals.includes(H)) intervals.push(H);
        
        const results = [];
        intervals.sort((a,b)=>a-b).forEach(h => {
            const x = 1 - (h / H);
            const y = p.a * Math.pow(x, 3) + p.b * Math.pow(x, 2) + p.c * x;
            const dia = Math.max(0, y * D);
            results.push({h, dia});
            
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${h.toFixed(1)}</td><td>${dia.toFixed(1)}</td>`;
            tableBody.appendChild(tr);
        });

        drawTree(results, H, D);
    }

    function drawTree(data, H, D) {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = canvas.offsetHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;
        ctx.clearRect(0, 0, w, h);
        
        const margin = 30;
        const scaleY = (h - margin * 2) / H;
        const scaleX = (w - margin * 2) / D;

        ctx.beginPath();
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 2;

        // 右側の曲線
        data.forEach((pt, i) => {
            const py = h - margin - (pt.h * scaleY);
            const px = w/2 + (pt.dia/2 * scaleX);
            if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        // 左側の曲線
        data.reverse().forEach(pt => {
            const py = h - margin - (pt.h * scaleY);
            const px = w/2 - (pt.dia/2 * scaleX);
            ctx.lineTo(px, py);
        });
        
        ctx.closePath();
        ctx.stroke();
        ctx.fillStyle = 'rgba(46, 125, 50, 0.1)';
        ctx.fill();
    }

    [speciesEl, heightEl, dbhEl].forEach(el => el.addEventListener('input', calculate));

    // 初期読み込み
    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('taper_last_data'));
        if(saved) {
            speciesEl.value = saved.s;
            heightEl.value = saved.h;
            dbhEl.value = saved.d;
        }
        calculate();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    };
</script>
</body>
</html>
